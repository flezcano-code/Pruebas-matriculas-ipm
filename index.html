<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Matrículas</title>

<style>
body {
    font-family: Arial;
    background:#eef2f7;
    margin:0;
}

/* HEADER */
.header {
    background:#0b6b2e;
    color:white;
    padding:15px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left {
    display:flex;
    align-items:center;
    gap:15px;
}

.logo {
    height:70px;
}

.titulo {
    font-size:22px;
    font-weight:bold;
}

/* CONTENIDO */
.container {
    padding:20px;
}

.filtros {
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

input, select {
    padding:8px;
}

.contador {
    margin-bottom:10px;
    font-weight:bold;
}

/* TABLA */
table {
    width:100%;
    background:white;
</html>
