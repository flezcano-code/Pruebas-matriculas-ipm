<!DOCTYPE html>
<html lang="es">
<head>

<style>
body {

}

#paginacion {

}

#paginacion button {
    margin-right:5px;

}

@media(max-width:700px){

</style>
</head>

<div class="header">

    <div class="header-left">

            Sistema de Matrículas 2026
        </div>
    </div>

    <img src="logo2.png" class="logo">

</div>

<div class="container">

    <div class="filtros">

        <input
            type="text"
            id="buscar"
            placeholder="Buscar alumno o RUN"
        >

        <select id="filtroCurso">
            <option value="">Todos los cursos</option>
        </select>

    </div>

    <div class="contador" id="contador"></div>

    <table>

        <thead>
            <tr>
                <th>Estudiante</th>
                <th>RUN</th>
                <th>Curso</th>
                <th>Revisión</th>
            </tr>
        </thead>

        <tbody id="tabla"></tbody>

    <div id="paginacion"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

/* CSV ALUMNOS */
const URL =
"https://docs.google.com/spreadsheets/d/1GSzXCiP3tCexOFUqXXJPzHNGR5BAjjRX5e3FcYQnWDs/gviz/tq?tqx=out:csv&gid=0";

/* CSV LOGIN */
const LOGIN_URL =
"https://docs.google.com/spreadsheets/d/1GSzXCiP3tCexOFUqXXJPzHNGR5BAjjRX5e3FcYQnWDs/gviz/tq?tqx=out:csv&gid=763610446";

let data = [];
let loginData = [];

let pagina = 1;
const porPagina = 20;

/* CARGAR ALUMNOS */
Papa.parse(URL, {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {

        data = results.data;

        cargarCursos();

        render();
    }
});

/* CARGAR LOGIN */
Papa.parse(LOGIN_URL, {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {

        loginData = results.data;
    }
});

/* CURSOS */
function cargarCursos(){

    const select =
        document.getElementById("filtroCurso");

    const cursos =
        [...new Set(
            data.map(d => d["Curso"]).filter(Boolean)
        )];

    cursos.sort().forEach(curso => {

        select.innerHTML += `
        <option value="${curso}">
            ${curso}
        </option>`;
    });
}

/* RENDER */
function render(){

    const b =
        document.getElementById("buscar")
        .value
        .toLowerCase();

    const cursoFiltro =
        document.getElementById("filtroCurso")
        .value;

    const tabla =
        document.getElementById("tabla");

    const filtrado = data.filter(d => {

        const coincideTexto =

            (d["Estudiante"] || "")
            .toLowerCase()
            .includes(b)

            ||

            (d["RUN / IPE"] || "")
            .includes(b);

        const coincideCurso =
            !cursoFiltro || d["Curso"] === cursoFiltro;

        return coincideTexto && coincideCurso;
    });

    document.getElementById("contador").innerText =
        "Total alumnos: " + filtrado.length;

    tabla.innerHTML = "";

    let datosMostrar;

    /* CURSO COMPLETO */
    if(cursoFiltro){

        datosMostrar = filtrado;

        document.getElementById("paginacion")
        .innerHTML = "";

    } else {

        const inicio =
            (pagina - 1) * porPagina;

        const fin =
            inicio + porPagina;

        datosMostrar =
            filtrado.slice(inicio, fin);

        renderPaginacion(filtrado.length);
    }

    datosMostrar.forEach(d => {

        const realIndex = data.indexOf(d);

        tabla.innerHTML += `
        <tr>

            <td>${safe(d["Estudiante"])}</td>

            <td>${safe(d["RUN / IPE"])}</td>

            <td>${safe(d["Curso"])}</td>

            <td>

                <button onclick="verDetalle(${realIndex})">
                    Review
                </button>

                <button onclick="loginReporte(${realIndex})">
                    Report
                </button>

            </td>

        </tr>`;
    });
}

/* PAGINACION */
function renderPaginacion(total){

    const totalPaginas =
        Math.ceil(total / porPagina);

    const cont =
        document.getElementById("paginacion");

    cont.innerHTML = "";

    for(let i = 1; i <= totalPaginas; i++){

        cont.innerHTML += `
        <button onclick="irPagina(${i})">
            ${i}
        </button>`;
    }
}

function irPagina(p){

    pagina = p;

    render();
}

/* REVIEW */

    );

        <div class="card"><b>Curso:</b><br>${safe(d["Curso"])}</div>

        <div class="card"><b>Domicilio:</b><br>${safe(d["Domicilio"])}</div>

        <div class="card"><b>Comuna:</b><br>${safe(d["Comuna"])}</div>

        </div>

    <div class="seccion">

            <div class="card"><b>Nombre:</b><br>${safe(d["Nombre Apoderado SUPLENTE"])}</div>

            <div class="card"><b>RUT:</b><br>${safe(d["RUT SUPLENTE"])}</div>

            <div class="card"><b>Teléfono:</b><br>${safe(d["Teléfono SUPLENTE"])}</div>

            <div class="card"><b>Email:</b><br>${safe(d["Correo Electrónico SUPLENTE"])}</div>

        </div>

    </div>

    ${
        pdfUrl
        ?
        `
        <div class="seccion">

            <h3>Ficha del Alumno</h3>

            <iframe
                src="${pdfUrl}"
                width="100%"
                height="600">
            </iframe>

        </div>
        `
        :
        ""
    }

    </body>

    </html>
    `);
}

/* LOGIN */
function loginReporte(i){

    const usuario = prompt("Usuario:");

    if(usuario === null) return;

    const password = prompt("Contraseña:");

    if(password === null) return;

    const valido = loginData.find(l =>

        String(l["usuario"]).trim() === usuario.trim()
        &&
        String(l["contraseña"]).trim() === password.trim()
    );

    if(!valido){

        alert("Credenciales incorrectas");

        return;
    }

    abrirReporte(i);
}

/* ============================================================
   REPORTE — Declaración Individual de Accidente Escolar (DIAE)
   Réplica fiel del formulario oficial del Ministerio de Educación
   ============================================================ */
function abrirReporte(i){

    const d = data[i];

    const ahora = new Date();

    const anio  = String(ahora.getFullYear()).slice(-2); // "26"
    const mes   = String(ahora.getMonth()+1).padStart(2,'0');
    const dia   = String(ahora.getDate()).padStart(2,'0');
    const hora  = String(ahora.getHours()).padStart(2,'0');
    const mins  = String(ahora.getMinutes()).padStart(2,'0');

/* =========================================================
   DÍA DE LA SEMANA
========================================================= */

const diaSemanaNumero = (() => {

    const jsDay = ahora.getDay();

    switch(jsDay){

        case 1: return "1";
        case 2: return "2";
        case 3: return "3";
        case 4: return "4";

        case 0: return "7";

    return "";

})();
    
    /* Descomponer nombre del alumno en apellidos + nombres */
    /* Formato esperado en la planilla: "APELLIDO1 APELLIDO2, NOMBRES" o "NOMBRES APELLIDO1 APELLIDO2" */
    /* Intentamos separar por coma; si no hay coma dejamos todo en nombres */
    /* =========================================================
   DATOS REALES DESDE CSV
========================================================= */

/* Nombre alumno */
const estudianteRaw =
    d["Estudiante"]
    || d["Alumno"]
    || "";

/* =========================================================
   SEPARAR NOMBRES Y APELLIDOS
   FORMATO:
   Alison Arira Letelier Nuñez
========================================================= */

let apPaterno = "";
let apMaterno = "";
let nombres = "";

const partesNombre =
    estudianteRaw
    .trim()
    .split(/\s+/);

if(partesNombre.length >= 4){

    apPaterno =
        partesNombre[2] || "";

    apMaterno =
        partesNombre[3] || "";

    nombres =
        partesNombre[0] + " " + partesNombre[1];

}
else if(partesNombre.length === 3){

    nombres =
        partesNombre[0];

    apPaterno =
        partesNombre[1];

    apMaterno =
        partesNombre[2];

}
else{

    nombres = estudianteRaw;
}

/* =========================================================
   FECHA NACIMIENTO
========================================================= */

const fnRaw =
    d["Fecha Nacimiento"]
    || d["Fecha nacimiento"]
    || "";

/* =========================================================
   SEXO
========================================================= */

const sexoTexto =
    (
        d["Sexo"]
        || d["sexo"]
        || d["Género"]
        || d["Genero"]
        || ""
    )
    .toString()
    .toLowerCase();

let sexoCod = "";

if(
    sexoTexto.includes("f")
    ||
    sexoTexto.includes("mujer")
){

    sexoCod = "2";

}
else if(
    sexoTexto.includes("m")
    ||
    sexoTexto.includes("hombre")
){

    sexoCod = "1";
}

/* =========================================================
   DOMICILIO
========================================================= */
const domicilioCompleto =
    d["Domicilio"]
    || d["Dirección"]
    || "";
    
let calle = domicilioCompleto;
let numeroDireccion = "";

const matchNumero = domicilioCompleto.match(/(.*?)(\d+.*)$/);

if(matchNumero){

    calle = matchNumero[1].trim();
    numeroDireccion = matchNumero[2].trim();
}

/* =========================================================
   COMUNA
========================================================= */

const comunaAlumno =
    d["Comuna"]
    || d["Ciudad"]
    || "Copiapó";

/* =========================================================
   EDAD AUTOMÁTICA
========================================================= */

let edad = "";

if(fnRaw){

    let fn;

    if(fnRaw.includes("-")){

        const p = fnRaw.split("-");

        fn = new Date(
            p[2],
            p[1]-1,
            p[0]
        );

    } else {

        fn = new Date(fnRaw);
    }

    if(!isNaN(fn)){

        const hoy = new Date();

        edad =
            hoy.getFullYear()
            - fn.getFullYear();

        const m =
            hoy.getMonth()
            - fn.getMonth();

        if(
            m < 0
            ||
            (
                m === 0
                &&
                hoy.getDate() < fn.getDate()
            )
        ){
            edad--;
        }
    }
}

/* =========================================================
   FECHA NACIMIENTO SEPARADA
========================================================= */

let fnDia = "";
let fnMes = "";
let fnAnioFull = "";

if(fnRaw.includes("-")){

    const p = fnRaw.split("-");

    fnDia = p[0] || "";
    fnMes = p[1] || "";
    fnAnioFull = p[2] || "";
}

/* =========================================================
   RUN
========================================================= */

const runRaw =
    d["RUN / IPE"]
    || d["RUN"]
    || "";

const runClean =
    runRaw
    .replace(/\./g,"")
    .replace("-","");

/* =========================================================

========================================================= */

    /* Helper: crea una casilla tipo cuadrado con un carácter */
function box(val, w){

    w = w || "22px";

    return `
    <span
        contenteditable="true"
        spellcheck="false"
        style="
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:${w};
            height:22px;
            border:1px solid black;
            text-align:center;
            font-size:11px;
            font-family:Arial;
            vertical-align:middle;
            overflow:hidden;
            white-space:nowrap;
            outline:none;
        "
    >${val || ""}</span>`;
}

    /* Helper: casillas para cada carácter de un string */
    function boxes(str, n){
        const s = (str||"").toString().toUpperCase();
        let out = "";
        for(let i=0; i<n; i++){
            out += box(s[i]||"");
        }
        return out;
    }

/* SAFE */
function safe(text){

    if(!text) return "";

    return text.toString()
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}
