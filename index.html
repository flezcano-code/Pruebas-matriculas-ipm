
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Matrículas</title>

<style>
body {
    font-family: Arial;
    background:#eef2f7;
    margin:0;
}

/* HEADER */
.header {
    background:#0b6b2e;
    color:white;
    padding:15px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left {
    display:flex;
    align-items:center;
    gap:15px;
}

.logo {
    height:70px;
}

.titulo {
    font-size:22px;
    font-weight:bold;
}

/* CONTENIDO */
.container {
    padding:20px;
}

.filtros {
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

input, select {
    padding:8px;
}

.contador {
    margin-bottom:10px;
    font-weight:bold;
}

/* TABLA */
table {
    width:100%;
    background:white;
    border-collapse:collapse;
}

th {
    background:#14532d;
    color:white;
    padding:10px;
}

td {
    padding:8px;
    border-bottom:1px solid #eee;
}

/* BOTONES */
button {
    padding:5px 10px;
    background:#15803d;
    color:white;
    border:none;
    cursor:pointer;
    margin-right:5px;
}

button:hover {
    background:#166534;
}

/* PAGINACIÓN */
#paginacion {
    margin-top:15px;
}

#paginacion button {
    margin-right:5px;
    margin-top:5px;
}

@media(max-width:700px){

    table{
        font-size:13px;
    }

    .logo{
        height:50px;
    }

}
</style>
</head>

<body>

<div class="header">

    <div class="header-left">
        <img src="logo.png" class="logo">

        <div class="titulo">
            Sistema de Matrículas 2026
        </div>
    </div>

    <img src="logo2.png" class="logo">

</div>

<div class="container">

    <div class="filtros">

        <input
            type="text"
            id="buscar"
            placeholder="Buscar alumno o RUN"
        >

        <select id="filtroCurso">
            <option value="">Todos los cursos</option>
        </select>

    </div>

    <div class="contador" id="contador"></div>

    <table>

        <thead>
            <tr>
                <th>Estudiante</th>
                <th>RUN</th>
                <th>Curso</th>
                <th>Revisión</th>
            </tr>
        </thead>

        <tbody id="tabla"></tbody>

    </table>

    <div id="paginacion"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

/* CSV ALUMNOS */
const URL =
"https://docs.google.com/spreadsheets/d/1GSzXCiP3tCexOFUqXXJPzHNGR5BAjjRX5e3FcYQnWDs/gviz/tq?tqx=out:csv&gid=0";

/* CSV LOGIN */
const LOGIN_URL =
"https://docs.google.com/spreadsheets/d/1GSzXCiP3tCexOFUqXXJPzHNGR5BAjjRX5e3FcYQnWDs/gviz/tq?tqx=out:csv&gid=763610446";

let data = [];
let loginData = [];

let pagina = 1;
const porPagina = 20;

/* CARGAR ALUMNOS */
Papa.parse(URL, {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {

        data = results.data;

        cargarCursos();

        render();
    }
});

/* CARGAR LOGIN */
Papa.parse(LOGIN_URL, {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {

        loginData = results.data;
    }
});

/* CURSOS */
function cargarCursos(){

    const select =
        document.getElementById("filtroCurso");

    const cursos =
        [...new Set(
            data.map(d => d["Curso"]).filter(Boolean)
        )];

    cursos.sort().forEach(curso => {

        select.innerHTML += `
        <option value="${curso}">
            ${curso}
        </option>`;
    });
}

/* RENDER */
function render(){

    const b =
        document.getElementById("buscar")
        .value
        .toLowerCase();

    const cursoFiltro =
        document.getElementById("filtroCurso")
        .value;

    const tabla =
        document.getElementById("tabla");

    const filtrado = data.filter(d => {

        const coincideTexto =

            (d["Estudiante"] || "")
            .toLowerCase()
            .includes(b)

            ||

            (d["RUN / IPE"] || "")
            .includes(b);

        const coincideCurso =
            !cursoFiltro || d["Curso"] === cursoFiltro;

        return coincideTexto && coincideCurso;
    });

    document.getElementById("contador").innerText =
        "Total alumnos: " + filtrado.length;

    tabla.innerHTML = "";

    let datosMostrar;

    /* CURSO COMPLETO */
    if(cursoFiltro){

        datosMostrar = filtrado;

        document.getElementById("paginacion")
        .innerHTML = "";

    } else {

        const inicio =
            (pagina - 1) * porPagina;

        const fin =
            inicio + porPagina;

        datosMostrar =
            filtrado.slice(inicio, fin);

        renderPaginacion(filtrado.length);
    }

    datosMostrar.forEach(d => {

        const realIndex = data.indexOf(d);

        tabla.innerHTML += `
        <tr>

            <td>${safe(d["Estudiante"])}</td>

            <td>${safe(d["RUN / IPE"])}</td>

            <td>${safe(d["Curso"])}</td>

            <td>

                <button onclick="verDetalle(${realIndex})">
                    Review
                </button>

                <button onclick="loginReporte(${realIndex})">
                    Report
                </button>

            </td>

        </tr>`;
    });
}

/* PAGINACION */
function renderPaginacion(total){

    const totalPaginas =
        Math.ceil(total / porPagina);

    const cont =
        document.getElementById("paginacion");

    cont.innerHTML = "";

    for(let i = 1; i <= totalPaginas; i++){

        cont.innerHTML += `
        <button onclick="irPagina(${i})">
            ${i}
        </button>`;
    }
}

function irPagina(p){

    pagina = p;

    render();
}

/* REVIEW */
function verDetalle(i){

    const d = data[i];

    const pdfUrl =
        d["Merged Doc URL - FICHA 2026"]

        ?

        d["Merged Doc URL - FICHA 2026"]
        .replace("/view", "/preview")

        :

        "";

    const w = window.open(
        "",
        "_blank",
        "width=1200,height=900"
    );

    w.document.write(`

    <html>

    <head>

    <title>Ficha Alumno</title>

    <style>

    body{
        font-family:Arial;
        padding:20px;
    }

    h2{
        color:#0b6b2e;
        margin-bottom:10px;
    }

    .grid{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        margin-top:10px;
    }

    .card{
        background:#f9fafb;
        padding:10px;
        border-radius:6px;
        border:1px solid #ddd;
    }

    .seccion{
        margin-top:25px;
        padding-top:10px;
        border-top:2px solid #ddd;
    }

    iframe{
        border:none;
    }

    </style>

    </head>

    <body>

    <h2>${safe(d["Estudiante"])}</h2>

    <div class="grid">

        <div class="card"><b>RUN:</b><br>${safe(d["RUN / IPE"])}</div>

        <div class="card"><b>Nacionalidad:</b><br>${safe(d["Nacionalidad"])}</div>

        <div class="card"><b>Nombre Social:</b><br>${safe(d["Nombre Social"])}</div>

        <div class="card"><b>Fecha Nacimiento:</b><br>${safe(d["Fecha Nacimiento"])}</div>

        <div class="card"><b>Sexo:</b><br>${safe(d["Sexo"])}</div>

        <div class="card"><b>Género:</b><br>${safe(d["Id. de Género"])}</div>

        <div class="card"><b>Nivel:</b><br>${safe(d["Nivel"])}</div>

        <div class="card"><b>Curso:</b><br>${safe(d["Curso"])}</div>

        <div class="card"><b>Domicilio:</b><br>${safe(d["Domicilio"])}</div>

        <div class="card"><b>Comuna:</b><br>${safe(d["Comuna"])}</div>

        <div class="card"><b>Correo:</b><br>${safe(d["Correo Electrónico"])}</div>

        <div class="card"><b>Teléfono:</b><br>${safe(d["Teléfono"])}</div>

    </div>

    <div class="seccion">

        <h3>Apoderado Titular</h3>

        <div class="grid">

            <div class="card"><b>Nombre:</b><br>${safe(d["Nombre Apoderado TITULAR"])}</div>

            <div class="card"><b>RUT:</b><br>${safe(d["RUT  TITULAR"])}</div>

            <div class="card"><b>Teléfono:</b><br>${safe(d["Teléfono  TITULAR"])}</div>

            <div class="card"><b>Nivel Educacional:</b><br>${safe(d["Nivel Educacional TITULAR"])}</div>

            <div class="card"><b>Email:</b><br>${safe(d["Correo Electrónico  TITULAR"])}</div>

        </div>

    </div>

    <div class="seccion">

        <h3>Apoderado Suplente</h3>

        <div class="grid">

            <div class="card"><b>Nombre:</b><br>${safe(d["Nombre Apoderado SUPLENTE"])}</div>

            <div class="card"><b>RUT:</b><br>${safe(d["RUT SUPLENTE"])}</div>

            <div class="card"><b>Teléfono:</b><br>${safe(d["Teléfono SUPLENTE"])}</div>

            <div class="card"><b>Email:</b><br>${safe(d["Correo Electrónico SUPLENTE"])}</div>

        </div>

    </div>

    ${
        pdfUrl
        ?
        `
        <div class="seccion">

            <h3>Ficha del Alumno</h3>

            <iframe
                src="${pdfUrl}"
                width="100%"
                height="600">
            </iframe>

        </div>
        `
        :
        ""
    }

    </body>

    </html>
    `);
}

/* LOGIN */
function loginReporte(i){

    const usuario = prompt("Usuario:");

    if(usuario === null) return;

    const password = prompt("Contraseña:");

    if(password === null) return;

    const valido = loginData.find(l =>

        String(l["usuario"]).trim() === usuario.trim()
        &&
        String(l["contraseña"]).trim() === password.trim()
    );

    if(!valido){

        alert("Credenciales incorrectas");

        return;
    }

    abrirReporte(i);
}

    const minuto =

    const w = window.open(

    w.document.write(`

    <body>

/* SAFE */
function safe(text){

    if(!text) return "";

    return text.toString()
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

/* EVENTOS */
document.getElementById("buscar")
.addEventListener("input", () => {

    pagina = 1;

    render();
});

document.getElementById("filtroCurso")
.addEventListener("change", () => {

    pagina = 1;

    render();
});

</script>

</html>
